## Starship template.
##
## `theme` renders this file to ~/.config/starship.toml, substituting the
## placeholder on the `palette` line below with the active theme's palette
## name. Edit THIS file, never ~/.config/starship.toml — that one is
## regenerated, so edits there are lost on the next `theme` or `chezmoi apply`.
##
## (The placeholder token is deliberately not repeated in this comment: the
## substitution is global, so it would be rewritten here too.)
##
## After editing, run:  theme reload

# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Selected by `theme`. Every palette is defined at the bottom of this file.
palette = "@THEME_PALETTE@"

# Inserts a blank line between shell prompts
add_newline = true

[cmd_duration]
min_time = 0 #2_000  # Montre le temps d'exécution pour les commandes prenant plus de 2 secondes
show_milliseconds = true
format = '[󰔟 $duration]($style) '
style = 'fg:peach'

# Replace the '❯' symbol in the prompt with '➜'
[character] # The name of the module we are configuring is 'character'
success_symbol = '[➜](bold green)' # The 'success_symbol' segment is being set to '➜' with the color 'bold green'
error_symbol = '[➜](bold red)'
vimcmd_symbol = '[❮](bold green)'

# ---------------------------------------------------------------------------
# Modules below are palette-aware, so they follow whichever theme is active.
# ---------------------------------------------------------------------------

[directory]
style = 'bold fg:blue'
truncation_length = 4
truncate_to_repo = true
read_only = ' 󰌾'

[git_branch]
symbol = ' '
style = 'fg:mauve'
format = 'on [$symbol$branch]($style) '

[git_status]
style = 'fg:red'
format = '([\[$all_status$ahead_behind\]]($style) )'

[git_state]
style = 'fg:peach'

[hostname]
ssh_only = true
style = 'bold fg:teal'
format = '[@$hostname]($style) '

[username]
show_always = false
style_user = 'fg:subtext'
style_root = 'bold fg:red'

[dotnet]
symbol = ' '
style = 'fg:mauve'
heuristic = true

[nodejs]
symbol = ' '
style = 'fg:green'

[docker_context]
symbol = ' '
style = 'fg:blue'

[python]
symbol = ' '
style = 'fg:yellow'

[rust]
symbol = ' '
style = 'fg:peach'

[golang]
symbol = ' '
style = 'fg:teal'

[package]
symbol = '󰏗 '
style = 'fg:yellow'

# ===========================================================================
#  Palettes
#
#  Catppuccin palettes follow upstream's naming (catppuccin/starship).
#  Rose Pine does NOT publish a Starship palette — upstream ships whole
#  configs instead — so the three Rose Pine palettes below were extracted by
#  hand from the official colour spec and aliased onto the Catppuccin key
#  names (mauve, peach, teal, …) so that one set of module styles works for
#  every theme. Do not expect them to match a file in rose-pine/starship.
# ===========================================================================

