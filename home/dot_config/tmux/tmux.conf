# ~/.config/tmux/tmux.conf
#
# Managed by chezmoi. Plugins live in ~/.config/tmux/plugins (cloned by
# .chezmoiexternal.toml); colours come from theme.conf, which is generated by
# `theme` and is deliberately not tracked in the repo.

# --- Plugin manager location ------------------------------------------------
# Keeps everything under XDG instead of the legacy ~/.tmux.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"

# --- Terminal ---------------------------------------------------------------
set -g default-terminal "tmux-256color"
# True colour for Ghostty and anything else that advertises RGB.
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-features  ",xterm-ghostty:RGB"
set -ga terminal-features  ",alacritty:RGB"
# Undercurl + coloured underlines (used by Neovim diagnostics).
set -ga terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -ga terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Do not swallow the Escape key — this is the classic cause of laggy Vim/Neovim
# inside tmux.
set -sg escape-time 10
set -g focus-events on

# --- General behaviour ------------------------------------------------------
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g display-time 2000
setw -g mode-keys vi

# Inherit the current pane's directory when splitting or creating a window.
bind c  new-window      -c "#{pane_current_path}"
bind '"' split-window   -v -c "#{pane_current_path}"
bind %  split-window    -h -c "#{pane_current_path}"

# More memorable split bindings, kept alongside the defaults.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload config.
bind r source-file "$HOME/.config/tmux/tmux.conf" \; display "tmux.conf reloaded"

# --- Plugins ----------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'Morantron/tmux-fingers'

# tmux-yank: copy to the system clipboard (wl-copy on Wayland).
set -g @yank_selection 'clipboard'
set -g @yank_selection_mouse 'clipboard'
set -g @yank_action 'copy-pipe-no-clear'

# tmux-fingers: prefix + F highlights every match on screen, press the hint
# letter to copy it.
set -g @fingers-key F

# NOTE: the colour themes are NOT TPM plugins. catppuccin/tmux explicitly
# recommends against TPM (plugin name conflicts) while rose-pine/tmux expects
# it, so both are cloned to ~/.config/tmux/themes/ by chezmoi and only the
# active one is sourced below.
source-file -q "$HOME/.config/tmux/theme.conf"

# Machine-specific overrides, untracked.
source-file -q "$HOME/.config/tmux/local.conf"

# Keep this last — tpm must run after every plugin declaration.
run '~/.config/tmux/plugins/tpm/tpm'
