# ~/.config/noctalia/config.toml — managed by chezmoi.
#
# Only the keys set here are pinned; everything else is Noctalia's default.
# NOTE: changes made in Noctalia's settings GUI land in
# ~/.local/state/noctalia/settings.toml, which loads LAST and wins over this
# file — settle a value there, then move it here if it should be provisioned.

[theme]
# The desktop themes itself from the wallpaper (Material-You style).
# Terminals and editors stay owned by the `theme` script.
source           = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"
mode             = "dark"
