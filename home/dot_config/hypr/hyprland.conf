# ~/.config/hypr/hyprland.conf
#
# STUB — this file only materialises on a machine actually running Hyprland
# (see home/.chezmoiignore). On the current Fedora + GNOME setup chezmoi skips
# it entirely.
#
# It exists now so that the theme switcher already has a Hyprland target: when
# you move to HyDE, `theme` writes ~/.config/hypr/theme.conf and calls
# `hyprctl reload`, and the shell/terminal/editor side needs no changes at all.
#
# HyDE ships an opinionated Hyprland config of its own. The intended merge is
# to keep HyDE's config as the base and source this file's theme.conf from it,
# rather than replacing HyDE wholesale.

# Variables set by `theme`: $theme_name, $theme_family, $theme_variant,
# $theme_polarity. Hyprland has no optional-source syntax, so this file must
# exist — the theme pass at the end of every `chezmoi apply` creates it
# whenever ~/.config/hypr is present, which is the same apply that writes
# this file.
source = ~/.config/hypr/theme.conf

# --- Placeholder baseline ---------------------------------------------------
# Deliberately minimal. Fill in (or let HyDE provide) monitors, keybinds,
# input and rules when the migration actually happens.

$terminal = ghostty
$fileManager = nautilus
$menu = wofi --show drun

exec-once = /usr/libexec/polkit-gnome-authentication-agent-1

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    layout = dwindle
}

decoration {
    rounding = 8
    blur {
        enabled = true
        size = 6
        passes = 2
    }
}

input {
    kb_layout = fr
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

$mainMod = SUPER

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, $menu
bind = $mainMod, F, fullscreen,

# Cycle the system theme — same command the shell and Neovim use.
bind = $mainMod SHIFT, T, exec, theme next --quiet
