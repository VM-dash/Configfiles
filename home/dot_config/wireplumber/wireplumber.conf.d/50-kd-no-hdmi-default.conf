# Never let a monitor steal the audio output.
#
# Plugging a screen in over USB-C/DP/HDMI adds HDMI sinks, and WirePlumber
# picks the highest-priority available sink as the default. These monitors
# (Dell P2422H / U2415) have no speakers, so the laptop went silent every
# time it was docked. Dropping the HDMI sinks far below the built-in speaker
# (1000) and headphones keeps sound on the laptop; they can still be chosen
# by hand in the control centre when a screen really does have speakers.

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*HDMI.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 100
      }
    }
  }
]
