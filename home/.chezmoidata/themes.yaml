# Theme catalog — the single source of truth for the `theme` switcher.
#
# Rendered by chezmoi to ~/.config/theme/themes.json, which ~/.local/bin/theme
# reads at runtime. Adding a theme = adding a block here (plus a matching
# [palettes.*] table in dot_config/theme/starship.template.toml).
#
# Field notes:
#   family/variant   also drive the tmux port and variant
#   ghostty          built-in Ghostty theme name (`ghostty +list-themes`)
#   nvim             :colorscheme name
#   starship_palette must match a [palettes.<name>] table in the starship template
#   bat              theme name as reported by `bat --list-themes`
#   gtk              directory name under ~/.themes (best-effort; see README)
#
# The external names above are kept explicit rather than derived from the key:
# they belong to upstream projects and have been renamed before (catppuccin/tmux
# v1 -> v2), so a silent mismatch is worth more than the saved lines.
# GNOME's accent is `purple` for every theme (Catppuccin mauve / Rose Pine iris),
# so it lives as a default in the switcher instead of being repeated seven times.

theme_order:
  - catppuccin-mocha
  - catppuccin-macchiato
  - catppuccin-frappe
  - catppuccin-latte
  - rose-pine
  - rose-pine-moon
  - rose-pine-dawn

themes:
  # =========================================================== Catppuccin ===
  catppuccin-mocha:
    label: "Catppuccin Mocha"
    family: catppuccin
    variant: mocha
    polarity: dark
    ghostty: "catppuccin-mocha"
    nvim: "catppuccin-mocha"
    starship_palette: catppuccin_mocha
    bat: "Catppuccin Mocha"
    gtk: "catppuccin-mocha-mauve-standard+default"
    fzf: "--color=bg+:#313244,bg:#1e1e2e,spinner:#f5e0dc,hl:#f38ba8 --color=fg:#cdd6f4,header:#f38ba8,info:#cba6f7,pointer:#f5e0dc --color=marker:#b4befe,fg+:#cdd6f4,prompt:#cba6f7,hl+:#f38ba8 --color=border:#6c7086,selected-bg:#45475a"

  catppuccin-macchiato:
