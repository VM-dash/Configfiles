    starship_palette: catppuccin_frappe
    bat: "Catppuccin Frappe"
    gtk: "catppuccin-frappe-mauve-standard+default"
    fzf: "--color=bg+:#414559,bg:#303446,spinner:#f2d5cf,hl:#e78284 --color=fg:#c6d0f5,header:#e78284,info:#ca9ee6,pointer:#f2d5cf --color=marker:#babbf1,fg+:#c6d0f5,prompt:#ca9ee6,hl+:#e78284 --color=border:#737994,selected-bg:#51576d"

  catppuccin-latte:
    label: "Catppuccin Latte"
    family: catppuccin
    variant: latte
    polarity: light
    ghostty: "catppuccin-latte"
    nvim: "catppuccin-latte"
    starship_palette: catppuccin_latte
    bat: "Catppuccin Latte"
    gtk: "catppuccin-latte-mauve-standard+default"
    fzf: "--color=bg+:#ccd0da,bg:#eff1f5,spinner:#dc8a78,hl:#d20f39 --color=fg:#4c4f69,header:#d20f39,info:#8839ef,pointer:#dc8a78 --color=marker:#7287fd,fg+:#4c4f69,prompt:#8839ef,hl+:#d20f39 --color=border:#9ca0b0,selected-bg:#bcc0cc"

  # ============================================================ Rose Pine ===
  rose-pine:
