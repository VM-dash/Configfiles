    family: catppuccin
    variant: macchiato
    polarity: dark
    ghostty: "catppuccin-macchiato"
    nvim: "catppuccin-macchiato"
    starship_palette: catppuccin_macchiato
    bat: "Catppuccin Macchiato"
    gtk: "catppuccin-macchiato-mauve-standard+default"
    fzf: "--color=bg+:#363a4f,bg:#24273a,spinner:#f4dbd6,hl:#ed8796 --color=fg:#cad3f5,header:#ed8796,info:#c6a0f6,pointer:#f4dbd6 --color=marker:#b7bdf8,fg+:#cad3f5,prompt:#c6a0f6,hl+:#ed8796 --color=border:#6e738d,selected-bg:#494d64"

  catppuccin-frappe:
