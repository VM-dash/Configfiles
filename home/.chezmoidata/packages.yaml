# Single source of truth for everything that gets installed.
#
# Editing this file changes the sha256 embedded in the run_onchange_ scripts,
# which makes chezmoi re-run them on the next `chezmoi apply`. Adding a package
# is a one-line change here — never edit the install scripts for that.
#
# NOTE: chezmoi merges dictionaries from .chezmoidata recursively but REPLACES
# lists. Never split one list across two files.

packages:
  # ---------------------------------------------------------------- Fedora --
  fedora:
    # Base system + things that must be native to integrate properly.
    dnf:
      - zsh
      - git
      - git-delta
      - gh
      - jq
      - unzip
      - wl-clipboard
      - xclip
      - fontconfig
      - dconf
      - pipx
      - ImageMagick
      - dnf5-plugins
      # Logitech HID++ daemon: forces the MX MagSpeed wheel to one classic
      # click per ratchet detent (see 22-logiops), taming TUI scroll speed.
      - logiops
    # Deliberate exceptions to Flatpak-first — these need host integration.
    dnf_gui:
      # No Flatpak exists for Ghostty, and a sandboxed terminal cannot host
      # the login shell anyway.
      - ghostty
      # Must see mise's dotnet/node and the host Docker socket.
      - code
      # Native rather than Flatpak because the Flatpak sandbox cannot read
      # /etc/brave/policies/managed (flatpak#4709), which is the only way to
      # declaratively force-install extensions and lock settings. Native also
      # fixes native messaging for the password-manager extensions and lets
      # Brave use gnome-keyring.
      - brave-browser
    # GNOME-only; skipped automatically on other desktops.
    dnf_gnome:
      - gnome-tweaks
    # Installed in the same transaction as the rest; 40-docker then owns only
    # the daemon and group setup.
    dnf_docker:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    # Preinstalled packages we do NOT want. Removed on every package pass;
    # already-absent packages are skipped.
    dnf_remove:
      # Japanese IME pulled in by Fedora Workstation's input-methods group.
      - ibus-anthy
      # Superseded by Noctalia's lock screen / idle handling.
      - hyprlock
      - hypridle
    # Hyprland + Noctalia session (installed alongside GNOME when the
    # `hyprland` data flag is true; GDM shows both sessions at login).
    # noctalia and brightnessctl/playerctl come from Fedora proper; the
    # hypr* packages come from the copr_hyprland repo below.
    dnf_hyprland:
      - hyprland                     # ≥0.55: Lua config (hyprland.lua)
      - xdg-desktop-portal-hyprland
      - hyprpolkitagent              # polkit dialogs (GNOME's agent is shell-bound)
      # No hyprlock/hypridle: Noctalia ships its own lock screen and idle
      # handling (Super+L → `noctalia msg session lock`).
      - hyprshot                     # Super+Shift+S region screenshots
      - noctalia
      - brightnessctl
      - playerctl
      # TUI monitor arranger (drag screens, no coordinate math); Super+Shift+M.
      - hyprmoncfg
    # Third-party repos enabled before the install pass.
    copr:
      - scottames/ghostty
    # Enabled only when the hyprland flag is on. Fedora proper stopped
    # shipping hyprland; this COPR tracks it for F44 (hermitfeather also
    # carries the portal, hyprlock, hypridle, hyprshot).
    copr_hyprland:
      - hermitfeather/hyprland-dev
      - paolino/hyprmoncfg

  # -------------------------------------------------- Arch (Noctalia etc) --
  arch:
    pacman:
      - zsh
      - git
      - git-delta
      - github-cli
      - jq
      - unzip
      - wl-clipboard
      - xclip
      - fontconfig
      - dconf
      - python-pipx
      - imagemagick
    pacman_docker:
      - docker
      - docker-buildx
      - docker-compose
    pacman_gui:
      - ghostty
    # AUR-only on Arch; installed via paru/yay in the packages script.
    aur_gui:
      - visual-studio-code-bin
      - brave-bin
    pacman_gnome:
      - gnome-tweaks
    # Mirror of fedora.dnf_hyprland — all official Arch packages.
    pacman_hyprland:
      - hyprland
      - xdg-desktop-portal-hyprland
      - hyprpolkitagent
      - hyprshot
      - noctalia
      - brightnessctl
      - playerctl
    # AUR-only on Arch; installed through the AUR helper when flagged.
    aur_hyprland:
      - hyprmoncfg-bin

  # -------------------------------------------- Cross-distro, cross-desktop --
  common:
    # mise is the primary package manager for dev tooling. Identical versions
    # on Fedora and Arch, which keeps a future distro move cheap.
    #   dotnet, node -> mise core plugins
    #   neovim       -> vfox backend
    #   everything else -> aqua backend
    mise:
      - node@22
      - dotnet@9
      - neovim@latest
      - tmux@latest
      - starship@latest
      - lazygit@latest
      - fzf@latest
      - ripgrep@latest
      - fd@latest
      - bat@latest
      - eza@latest
      - zoxide@latest
      # opencode CLI. Deliberately here rather than the Fedora COPR
      # (sureclaw/opencode): mise pulls upstream's own release binaries via the
      # aqua backend, so Arch gets the same version and there is no third-party
      # rebuild to trust or wait on after a Fedora bump.
      - opencode@latest
      # herdr: agent-runtime multiplexer. Official mise registry entry; fallback
      # is `github:herdrdev/herdr` if an older mise lacks the package.
      - herdr@latest
      # druk: terminal code editor. Not in aqua, so the github backend pulls
      # upstream's own release binary (druk-linux-x64.tar.gz). Deliberately not
      # the official curl installer: that writes ~/.druk/bin and appends PATH
      # to .zshrc, which chezmoi owns.
      - github:letstri/druk@latest

    # Self-contained GUI apps. Same IDs on every distro.
    # NOTE: Brave is deliberately NOT here — see packages.fedora.dnf_gui.
    flatpak:
      - app.zen_browser.zen          # second browser
      - io.dbeaver.DBeaverCommunity  # database client
      - com.usebruno.Bruno           # API testing
      - md.obsidian.Obsidian         # notes
      - org.inkscape.Inkscape        # vector graphics
      - org.libreoffice.LibreOffice  # office suite

    # Installed by UUID via `gext`. GNOME only.
    gnome_extensions:
      - copyous@boerdereinar.dev     # clipboard manager (EGO 8834)
      # Required for the rose-pine shell style (Tweaks → Appearance → Shell).
      - user-theme@gnome-shell-extensions.gcampax.github.com

    # `code --install-extension`. Colour themes follow `theme`; icons stay Mocha.
    # Mirrors `code --list-extensions` — re-sync when installing from the UI.
    vscode_extensions:
      # Themes
      - Catppuccin.catppuccin-vsc
      - Catppuccin.catppuccin-vsc-icons
      - mvllow.rose-pine
      # AI
      - anthropic.claude-code
      # Git
      - eamodio.gitlens
      # .NET / C#
      - ms-dotnettools.csdevkit
      - ms-dotnettools.csharp
      - ms-dotnettools.vscode-dotnet-runtime
      - ms-vscode.powershell
      - heaths.vscode-guid
      # Web / API
      - svelte.svelte-vscode
      - bruno-api-client.bruno
      # Containers
      - ms-azuretools.vscode-containers
      # Formats
      - tamasfe.even-better-toml
      - asciidoctor.asciidoctor-vscode
      - vstirbu.vscode-mermaid-preview

    # Nerd Font — required for Starship glyphs and `eza --icons`.
    # NOTE: fonts are declared in .chezmoidata/fonts.yaml (`font.install`),
    # alongside the family names the app configs reference.

# ------------------------------------------------------------- Repo pins ----
# Pinned so a run is reproducible; bump deliberately.
externals:
  claude_desktop_repo: aaddrick/claude-desktop-debian
  nerd_fonts_repo: ryanoasis/nerd-fonts
