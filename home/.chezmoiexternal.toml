# Upstream repos cloned straight into the target state.
#
# `chezmoi apply` clones anything missing; `chezmoi update` pulls (--ff-only).
# refreshPeriod keeps apply fast by not hitting the network more than weekly.
#
# .chezmoiexternal.<format> is always interpreted as a template, so the git
# clones and the druk extension files are generated from tables rather than
# repeated verbatim.
#
# Why the tmux colour themes are cloned here rather than left to TPM:
# catppuccin/tmux explicitly recommends AGAINST TPM (plugin name conflicts)
# while rose-pine/tmux expects it. Cloning both to fixed paths and sourcing
# only the active one from theme.conf sidesteps the disagreement entirely.
# TPM is still used for the functional plugins (yank, fingers).
#
# NOTE: there is no rose-pine/bat repo — its .tmTheme files live in tm-theme.

{{- $repos := dict
      ".config/tmux/plugins/tpm"          "https://github.com/tmux-plugins/tpm.git"
      ".config/tmux/plugins/tmux-yank"    "https://github.com/tmux-plugins/tmux-yank.git"
      ".config/tmux/plugins/tmux-fingers" "https://github.com/Morantron/tmux-fingers.git"
      ".config/tmux/themes/catppuccin"    "https://github.com/catppuccin/tmux.git"
      ".config/tmux/themes/rose-pine"     "https://github.com/rose-pine/tmux.git"
      ".config/bat/themes/catppuccin"     "https://github.com/catppuccin/bat.git"
      ".config/bat/themes/rose-pine"      "https://github.com/rose-pine/tm-theme.git" -}}

{{ range $dest, $url := $repos }}
[{{ $dest | quote }}]
    type = "git-repo"
    url = {{ $url | quote }}
    refreshPeriod = "168h"
    [{{ $dest | quote }}.clone]
        args = ["--depth", "1"]
    [{{ $dest | quote }}.pull]
        args = ["--ff-only"]
{{ end -}}

# druk appearance extensions. Seeded here so `theme` can name catppuccin /
# rose-pine / nerd-icons on a fresh machine without waiting for the in-editor
# market. Dropped as <id>.json — druk also accepts <id>/extension.json.
{{- $druk := dict
      ".config/druk/extensions/catppuccin.json" "https://raw.githubusercontent.com/letstri/druk/main/extensions/catppuccin/extension.json"
      ".config/druk/extensions/rose-pine.json"  "https://raw.githubusercontent.com/letstri/druk/main/extensions/rose-pine/extension.json"
      ".config/druk/extensions/nerd-icons.json" "https://raw.githubusercontent.com/letstri/druk/main/extensions/nerd-icons/extension.json" -}}

{{ range $dest, $url := $druk }}
[{{ $dest | quote }}]
    type = "file"
    url = {{ $url | quote }}
    refreshPeriod = "168h"
{{ end -}}

# Rosé Pine desktop styling for the GNOME Tweaks slots: icons, cursor and
# shell — deliberately NOT the Legacy Applications (gtk-theme) slot, which
# stays Adwaita: rose-pine's GTK3 theme renders inverted colours under a
# dark preference, and libadwaita apps ignore it anyway (see 80-gnome).
# The shell theme exists only in the repo source (no release asset), so it
# is cut out of the branch tarball; "moon" is the only variant upstream.
[".local/share/icons/rose-pine-icons"]
    type = "archive"
    url = "https://github.com/rose-pine/gtk/releases/latest/download/rose-pine-icons.tar.gz"
    stripComponents = 2
    refreshPeriod = "168h"

[".local/share/icons/BreezeX-RosePine-Linux"]
    type = "archive"
    url = "https://github.com/rose-pine/cursors/releases/latest/download/BreezeX-RosePine-Linux.tar.xz"
    stripComponents = 1
    refreshPeriod = "168h"

[".local/share/themes/rose-pine-moon"]
    type = "archive"
    url = "https://github.com/rose-pine/gtk/archive/refs/heads/main.tar.gz"
    stripComponents = 3
    include = ["*/gnome_shell/moon/**"]
    refreshPeriod = "168h"
